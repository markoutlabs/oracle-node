# oracle-proxy: verified oracle data for web clients, as JSON over one WebSocket.
#
#   make proxy && target/release/oracle-proxy proxy/proxy.toml
#
# The proxy speaks plain ws on loopback. Put a reverse proxy in front that
# terminates TLS, for example Caddy, which also passes WebSocket upgrades:
#
#   oracle.example.com {
#       reverse_proxy 127.0.0.1:8792
#   }
#
# Web clients then connect to wss://oracle.example.com/v1/ws.

listen = "127.0.0.1:8792"

[upstream]
# The mainnet canister and governance address when absent.
# canister_id = "xb5gv-diaaa-aaaaf-qg5qa-cai"
# governance = "0x7FB990Cc1111a00931B6396E5780C79574e36897"

# This proxy's client API key, as hex, readable only by its owner (chmod 600).
# Make one with scripts/client-key.sh, and list it with scripts/add-client.sh.
client_key_file = "proxy.key"

# Nodes that must agree on a price. With fewer than three nodes listed, set
# quorum to what exists and allow_low_quorum = true; one node proves who is
# talking, not that the price is right.
quorum = 3

[feeds]
prices = ["CRYPTO.BTC/USD", "CRYPTO.ETH/USD", "CRYPTO.BTC/USDT"]
venues = ["CRYPTO.BTC/USDT"]
books = ["CRYPTO.BTC/USDT"]

[limits]
# Behind the reverse proxy every socket comes from 127.0.0.1. This takes the
# client address from the X-Forwarded-For entry that the reverse proxy adds.
trust_forwarded_for = true
