[package]
name = "oracle-server"
description = "Subscriber-facing WebSocket and REST server for a price oracle node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oracle-transport.workspace = true
oracle-types.workspace = true
oracle-wire.workspace = true

axum.workspace = true
bytes.workspace = true
futures-util.workspace = true
governor.workspace = true
hex.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
oracle-client = { workspace = true, features = ["libsecp"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }

[lints]
workspace = true
