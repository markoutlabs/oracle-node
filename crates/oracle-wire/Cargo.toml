[package]
name = "oracle-wire"
description = "Canonical encoding, signing, and verification for oracle price updates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["os-rng", "libsecp"]
# Key generation from the OS CSPRNG. Off for wasm32 canisters, which never
# generate keys and have no entropy source `getrandom` knows about.
os-rng = ["dep:getrandom"]
# The C `libsecp256k1` backend, the reference and the fastest. Native only.
libsecp = ["dep:secp256k1"]
# The pure-Rust `k256` backend, which needs no C compiler. It wins when both
# are on, and wasm32 always uses it. `make test` runs the golden vectors under
# each backend to prove that they agree.
pure-rust = ["dep:k256"]

[dependencies]
oracle-types.workspace = true

hex.workspace = true
getrandom = { workspace = true, optional = true }
k256 = { workspace = true, optional = true }
semver.workspace = true
serde.workspace = true
thiserror.workspace = true
tiny-keccak.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
secp256k1 = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
k256.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
