[package]
name = "oracle-registry-canister"
description = "The node registry as an Internet Computer canister: membership, key rotation, and a threshold-ECDSA-signed registry document."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No `os-rng`: a canister never generates keys and wasm32 has no entropy
# source `getrandom` knows about.
oracle-wire = { path = "../oracle-wire", version = "0.2.0", default-features = false, features = ["pure-rust"] }
oracle-quorum = { workspace = true, features = ["pure-rust"] }
oracle-types.workspace = true
oracle-registry-api.workspace = true

candid.workspace = true
ic-cdk.workspace = true
ic-cdk-management-canister.workspace = true
hex.workspace = true
ic-http-certification.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# For `testing`, which is left out of the wasm32 build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oracle-client = { workspace = true, features = ["pure-rust"] }
pocket-ic.workspace = true

# Native only: `examples/price_caller.rs` builds for wasm32, and tokio's `net` does not.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ic-response-verification.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time"] }
# Test keys go to `Signer::from_secret` as the node's keys do.
zeroize.workspace = true

# The canister that calls this one in the tests of callers that are canisters.
[[example]]
name = "price_caller"
crate-type = ["cdylib"]

[lints]
workspace = true
