[package]
name = "oracle-proxy"
description = "Serves verified oracle data to web clients as JSON over one WebSocket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oracle-client.workspace = true
oracle-types.workspace = true
oracle-wire.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
governor.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tower-http = { workspace = true, features = ["cors"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = { workspace = true, features = ["connect"] }

[lints]
workspace = true
