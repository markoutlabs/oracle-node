[package]
name = "oracle-client"
description = "Consumer SDK: verify signed oracle updates from many nodes and resolve one price."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["pure-rust"]
# The pure-Rust secp256k1 backend: no C compiler needed. The node turns it off
# and takes the C one; a build with both uses the pure one.
pure-rust = ["oracle-wire/pure-rust"]
# The C `libsecp256k1` backend, the fastest.
libsecp = ["oracle-wire/libsecp"]

[dependencies]
oracle-agg.workspace = true
oracle-transport.workspace = true
oracle-types.workspace = true
oracle-wire.workspace = true

backon.workspace = true
candid.workspace = true
futures-util.workspace = true
hdrhistogram.workspace = true
hex.workspace = true
ic-http-certification.workspace = true
ic-response-verification.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
clap.workspace = true
oracle-wire.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "test-util"] }

[lints]
workspace = true
