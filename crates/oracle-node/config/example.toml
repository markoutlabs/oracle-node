# An oracle node, end to end.
#
# Ingest subscriptions are DERIVED from the feed sources below — there is no
# separate instrument list to keep in sync. Two lists would drift, and the
# failure mode of that drift is a feed that quietly loses a venue.

# How often every feed is re-evaluated for heartbeats and stale venues. A price
# move is evaluated when it arrives, not on this timer.
tick_interval_ms = 25

[server]
listen = "0.0.0.0:8080"
# Distinct feeds a subscriber may have outstanding before it is disconnected as
# lagged. Fanout conflates per feed, so this is a breadth limit, not a depth one.
max_pending_feeds = 512

# What one peer can cost the node. Each value is above 0; these are the defaults.
# A peer counts by its IPv4 address or its IPv6 /64. Loopback counts only in the
# totals, because a TLS proxy on the same host brings every client from there.
# [server.limits]
# max_sockets = 1024            # open TCP sockets, in total
# sockets_per_ip = 16
# sockets_per_minute = 60       # new sockets from one address
# header_timeout_ms = 10000     # to send a request head; also the keep-alive idle limit
# max_handshakes = 256          # in progress, in total
# handshakes_per_ip = 4
# handshakes_per_minute = 30
# handshake_timeout_ms = 5000   # from the upgrade to auth_ok
# sessions_per_client = 8       # open at once for one client key, from any address
# messages_per_second = 10      # control messages from one session
# requests_per_minute = 60      # /v2/feeds, /v2/registry, /v2/health from one address
# limit_loopback = false

[signing]
# A file or an environment variable, never a command-line argument: arguments are
# visible in `ps` to every user on the box. The key file is an `age` file written
# by `oracle-node init`; the passphrase that opens it comes from a 0600 file, or
# from a prompt at startup when `passphrase_file` is absent.
key_file = "/etc/oracle/signing.key"
# passphrase_file = "/etc/oracle/passphrase"
# key_env = "ORACLE_SIGNING_KEY"

[registry]
# Exactly one of `path` and `url`. A file is pinned until the node restarts; a
# deployed node fetches from the registry canister instead.
path = "/etc/oracle/registry.json"
# url = "https://<canister-id>.icp0.io/registry.json"
# Pinned here rather than taken from the registry itself, which would let the
# document vouch for its own author.
governance_address = "0x0000000000000000000000000000000000000000"

[[feeds]]
symbol = "CRYPTO.BTC/USDT"
min_sources = 2
# Optional. Price each venue at the average fill for this notional, in quote
# units, from depth snapshots where the venue sends them.
impact_notional = "20000"
sources = [
  { venue = "binance", market = "spot", symbol = "BTCUSDT" },
  # Further venues land here as M4 adds their adapters.
]

[[feeds]]
symbol = "CRYPTO.BTC/USDT.PERP_MARK"
min_sources = 1
sources = [
  { venue = "binance", market = "linear_perp", symbol = "BTCUSDT", kinds = ["mark_price"] },
]

[[feeds]]
symbol = "CRYPTO.BTC/USDT.FUNDING_8H"
# A funding feed is slow by its kind: a 10 s heartbeat and a 90 s staleness
# limit for its venues. Neither is a setting.
min_sources = 1
sources = [
  { venue = "binance", market = "linear_perp", symbol = "BTCUSDT", kinds = ["funding"] },
]

# A venue market's endpoint in place of the built-in one: a regional host, a
# proxy, or a local feed for tests. The node refuses one that no feed reads.
# For binance it is the combined-stream base; the node adds the stream names.
# [[endpoints]]
# venue = "binance"
# market = "spot"
# url = "wss://data-stream.binance.vision/stream"
