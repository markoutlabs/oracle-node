[package]
name = "oracle-monitor"
description = "The internal consumer: subscribes to every node as the SDK would and exports cross-node divergence for Prometheus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oracle-monitor"
path = "src/main.rs"

[dependencies]
oracle-client.workspace = true
oracle-types.workspace = true
oracle-wire.workspace = true

axum.workspace = true
clap.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
