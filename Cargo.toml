[workspace]
resolver = "3"
members = [
    "crates/oracle-types",
    "crates/oracle-wire",
    "crates/oracle-ingest",
    "crates/oracle-agg",
    "crates/oracle-client",
    "crates/oracle-server",
    "crates/oracle-node",
    "crates/oracle-registry-canister",
    "crates/oracle-replay",
    "crates/oracle-transport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/price-oracle"

[workspace.dependencies]
oracle-types = { path = "crates/oracle-types", version = "0.1.0" }
oracle-wire = { path = "crates/oracle-wire", version = "0.1.0" }
oracle-agg = { path = "crates/oracle-agg", version = "0.1.0" }
oracle-ingest = { path = "crates/oracle-ingest", version = "0.1.0" }
oracle-client = { path = "crates/oracle-client", version = "0.1.0" }
oracle-server = { path = "crates/oracle-server", version = "0.1.0" }
oracle-node = { path = "crates/oracle-node", version = "0.1.0" }
oracle-transport = { path = "crates/oracle-transport", version = "0.1.0" }

# Internet Computer. Only the registry canister and its test use these.
candid = "0.10"
ic-cdk = "0.20"
ic-cdk-management-canister = "0.2"
ic-cdk-timers = "1"
pocket-ic = "9"
ic-http-certification = "4"
ic-response-verification = "4"

age = { version = "0.11", features = ["armor"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
backon = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", default-features = false, features = ["parsing", "std"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
# `rustls-no-provider`, not `rustls`: the workspace already pins rustls to the
# `ring` provider through tokio-tungstenite, and a second provider makes
# `ClientConfig::builder()` refuse to pick one at runtime.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rpassword = "7"
secp256k1 = { version = "0.31", default-features = false, features = ["std", "recovery"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
getrandom = "0.3"
# v2 transport (oracle-transport). HPKE only for the KEM and its exporter; it
# refuses to build without one AEAD, and `aes` shares the cipher with aes-gcm-siv.
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "hkdfsha2", "aes"] }
aes-gcm-siv = { version = "0.12", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-keccak = { version = "2", features = ["keccak"] }
tokio = { version = "1", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-util = "0.7"
toml = "0.9"
tracing-subscriber = "0.3"
tracing = "0.1"


proptest = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

# Selected pedantic lints. Money- and signature-handling code should not
# silently truncate, wrap, or panic.
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
indexing_slicing = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
unwrap_used = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false
