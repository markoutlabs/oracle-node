#
# CRYPTO.*.OPEN_INTEREST is a valid symbol and `ObsKind::OpenInterest` exists,
# but no decoder in this build emits one. A feed configured for it would halt
# permanently rather than fail loudly, so it is left out until an adapter fills
# it in.

