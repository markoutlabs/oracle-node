# Every feed kind this build can actually serve, across all fifteen venues.
#
#   cargo run -p oracle-node --example gen_local_registry -- --nodes 1 \
#     > node/registry.json
#   ORACLE_SIGNING_KEY=4141414141414141414141414141414141414141414141414141414141414141 \
#     cargo run -p oracle-node -- start node/all-feeds.toml --tail
#
# The key and governance address below are the deterministic ones
# `gen_local_registry --nodes 1` prints. They are derived from small integers and
# guessable by construction. Never use them anywhere real.
#
# Ingest subscriptions are DERIVED from the sources below — there is no separate
# instrument list to keep in sync.

# Heartbeats and stale venues are checked on this timer; price moves publish when
# they arrive. --tail is noisy; grep it (`| grep published`).
tick_interval_ms = 25

[server]
listen = "127.0.0.1:8791"
max_pending_feeds = 512

[signing]
key_env = "ORACLE_SIGNING_KEY"

[registry]
path = "node/registry.json"
governance_address = "0x5cbdd86a2fa8dc4bddd8a8f69dba48572eec07fb"

[clients]
path = "node/clients.json"

# ---------------------------------------------------------------- the peg
#
# Must come from native-USD venues only. Sourcing CRYPTO.USDT/USD from a
# USDT-quoted venue would be circular: it would report 1.0 by construction on
# exactly the day it stopped being true. §12.4.
#
# Coinbase, Kraken and Bitstamp are the native-USD venues in scope. A Bitfinex dollar is
# a balance at Bitfinex: on 2026-10-25 it bought 12 to 16 bp less BTC and ETH
# than a dollar on Coinbase or Kraken, and its USDT book sat at par while theirs
# sat at 0.9987. Bitfinex and Tether are one group, so the peg takes no Bitfinex book.

[[feeds]]
symbol = "CRYPTO.USDT/USD"
sanity_band = ["0.9", "1.1"]
min_sources = 1
# A stablecoin book can stay unchanged for up to 39 s. The connections confirm
# the quiet value, so the 2 s default holds (SPEC §5.2).
sources = [
  { venue = "coinbase", market = "spot", symbol = "USDT-USD" },
  { venue = "kraken", market = "spot", symbol = "USDT/USD" },
  { venue = "bitstamp", market = "spot", symbol = "usdtusd" },
]

# ------------------------------------------------------------ spot, USD
#
# Native-USD venues price directly; USDT-quoted venues are converted through the
# peg above. The peg's own uncertainty propagates in quadrature, so a wobbling
# peg widens the whole catalogue instead of silently mispricing it. Hyperliquid
# quotes in USDC, taken at par: there is no USDC peg, and its weight is small.
# Its spot pair is named by its index, the only name its socket takes. Bitfinex
# gives its Tether books, through the peg: its own dollar trades apart.

[[feeds]]
symbol = "CRYPTO.BTC/USD"
sanity_band = ["0.7", "1.4"]
impact_notional = "20000"
peg = "CRYPTO.USDT/USD"
min_sources = 2
sources = [
  { venue = "coinbase", market = "spot", symbol = "BTC-USD" },
  { venue = "kraken", market = "spot", symbol = "BTC/USD" },
  { venue = "bitstamp", market = "spot", symbol = "btcusd" },
  { venue = "binance", market = "spot", symbol = "BTCUSDT", converted = true },
  { venue = "bybit", market = "spot", symbol = "BTCUSDT", converted = true },
  { venue = "okx", market = "spot", symbol = "BTC-USDT", converted = true },
  { venue = "bitfinex", market = "spot", symbol = "tBTCUST", converted = true },
  { venue = "kucoin", market = "spot", symbol = "BTC-USDT", converted = true },
  { venue = "mexc", market = "spot", symbol = "BTCUSDT", converted = true },
  { venue = "hyperliquid", market = "spot", symbol = "@142" },  # UBTC/USDC
  { venue = "bitget", market = "spot", symbol = "BTCUSDT", converted = true },
  { venue = "gate", market = "spot", symbol = "BTC_USDT", converted = true },
]

[[feeds]]
symbol = "CRYPTO.ETH/USD"
