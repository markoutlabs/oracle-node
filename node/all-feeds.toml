# --------------------------------------------------- perpetual mark, USD
#
# Deribit's BTC-PERPETUAL is inverse (coin-margined) but USD-quoted; Kraken
# Futures' PF_ contracts are linear. Bitget's `_CM` contracts are coin-margined
# and USD-quoted, sized in USD. All price in USD, so none needs the peg.

[[feeds]]
symbol = "CRYPTO.BTC/USD.PERP_MARK"
sanity_band = ["0.7", "1.4"]
min_sources = 2
sources = [
  { venue = "deribit", market = "inverse_perp", symbol = "BTC-PERPETUAL", kinds = ["mark_price"] },
  { venue = "kraken", market = "linear_perp", symbol = "PF_XBTUSD", kinds = ["mark_price"] },
  { venue = "bitget", market = "inverse_perp", symbol = "BTCUSD_CM", kinds = ["mark_price"] },
]

[[feeds]]
symbol = "CRYPTO.ETH/USD.PERP_MARK"
sanity_band = ["0.7", "1.4"]
