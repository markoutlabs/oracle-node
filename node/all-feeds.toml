# -------------------------------------------------- perpetual mark, USDT
#
# Binance, Bybit, OKX, Bitfinex, KuCoin, Bitget and Gate perps are USDT-margined, so they
# belong under a /USDT symbol rather than being converted into the /USD one.
# Hyperliquid's, Lighter's and dYdX's are USDC-margined, taken at par. Lighter
# names a market by its number: 1 is BTC, 0 is ETH. dYdX's mark is its oracle
# price, and its books are thin, so it gives marks only. A KuCoin contract is
# `multiplier` coins on KuCoin's contracts endpoint (0.001 BTC, 0.01 ETH), and a
# MEXC one `contractSize` on its contract detail endpoint (0.0001 BTC, 0.01 ETH),
# and a Gate one `quanto_multiplier` on its contracts endpoint (0.0001 BTC, 0.01 ETH).

[[feeds]]
symbol = "CRYPTO.BTC/USDT.PERP_MARK"
sanity_band = ["0.7", "1.4"]
min_sources = 2
sources = [
  { venue = "binance", market = "linear_perp", symbol = "BTCUSDT", kinds = ["mark_price"] },
  { venue = "bybit", market = "linear_perp", symbol = "BTCUSDT", kinds = ["mark_price"] },
  { venue = "okx", market = "linear_perp", symbol = "BTC-USDT-SWAP", kinds = ["mark_price"], contract_size = "0.01" },
  { venue = "hyperliquid", market = "linear_perp", symbol = "BTC", kinds = ["mark_price"] },
  { venue = "bitfinex", market = "linear_perp", symbol = "tBTCF0:USTF0", kinds = ["mark_price"] },
  { venue = "kucoin", market = "linear_perp", symbol = "XBTUSDTM", kinds = ["mark_price"], contract_size = "0.001" },
  { venue = "mexc", market = "linear_perp", symbol = "BTC_USDT", kinds = ["mark_price"], contract_size = "0.0001" },
  { venue = "bitget", market = "linear_perp", symbol = "BTCUSDT", kinds = ["mark_price"] },
  { venue = "gate", market = "linear_perp", symbol = "BTC_USDT", kinds = ["mark_price"], contract_size = "0.0001" },
  { venue = "lighter", market = "linear_perp", symbol = "1", kinds = ["mark_price"] },  # BTC
  # { venue = "dydx", market = "linear_perp", symbol = "BTC-USD", kinds = ["mark_price"] },  # off until its books have a gap check (2026-10-29)
]

