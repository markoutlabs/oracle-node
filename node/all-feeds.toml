# -------------------------------------------------- perpetual mid, USDT
#
# Where the perps actually trade, from their own books and through the same
# median as spot. A mark is each venue's own formula; this is the market's level.
# OKX swap sizes are contracts: `contract_size` is `ctVal` on OKX's instruments
# endpoint (0.01 BTC, 0.1 ETH).
[[feeds]]
symbol = "CRYPTO.BTC/USDT.PERP_MID"
sanity_band = ["0.7", "1.4"]
min_sources = 2
impact_notional = "20000"
sources = [
  { venue = "binance", market = "linear_perp", symbol = "BTCUSDT" },
  { venue = "bybit", market = "linear_perp", symbol = "BTCUSDT" },
  { venue = "okx", market = "linear_perp", symbol = "BTC-USDT-SWAP", contract_size = "0.01" },
  { venue = "hyperliquid", market = "linear_perp", symbol = "BTC" },
  { venue = "bitfinex", market = "linear_perp", symbol = "tBTCF0:USTF0" },
  { venue = "kucoin", market = "linear_perp", symbol = "XBTUSDTM", contract_size = "0.001" },
  { venue = "mexc", market = "linear_perp", symbol = "BTC_USDT", contract_size = "0.0001" },
  { venue = "bitget", market = "linear_perp", symbol = "BTCUSDT" },
  { venue = "gate", market = "linear_perp", symbol = "BTC_USDT", contract_size = "0.0001" },
  { venue = "lighter", market = "linear_perp", symbol = "1" },  # BTC
]

