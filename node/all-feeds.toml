# --------------------------------------------------------------- funding
#
# DELIBERATELY SINGLE-SOURCE. `FUNDING_8H` promises a rate normalised to eight
# hours, and Deribit is the only venue here that publishes one: its `funding_8h`
# is a fraction over a fixed 8h window whatever its settlement cadence.
#
# Every other venue reports a fraction over ITS OWN interval — hourly on Kraken
# Futures, 8h, 4h or 1h on Binance depending on the contract. The node's funding
# frames state the interval, but the aggregator that builds this feed does not
# convert by it. Adding them would take a median across incomparable numbers and
# publish a confidently wrong figure without halting or degrading. Run with
# --tail and compare Deribit's `funding` against Kraken's: same contract, same
# instant, roughly 25x apart.
#
# See SPEC.md §13 open question 3. Do not add sources here until the aggregator
# converts by interval.

[[feeds]]
symbol = "CRYPTO.BTC/USD.FUNDING_8H"
# A funding feed is slow by its kind: a 10 s heartbeat, a 90 s staleness limit
# for its venues, and no sanity band.
min_sources = 1
sources = [
  { venue = "deribit", market = "inverse_perp", symbol = "BTC-PERPETUAL", kinds = ["funding"] },
]

[[feeds]]
symbol = "CRYPTO.ETH/USD.FUNDING_8H"
min_sources = 1
sources = [
  { venue = "deribit", market = "inverse_perp", symbol = "ETH-PERPETUAL", kinds = ["funding"] },
]

